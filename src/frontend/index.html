<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Chamados</title>
    <link rel="icon" href="./Img/gengar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-ticket-alt"></i> Gestão de Chamados</h1>
            <p>Sistema de suporte técnico</p>
        </header>

        <main>
            <!-- Formulário de Criação -->
            <section class="form-section" id="formSection">
                <div class="card">
                    <h2><i class="fas fa-plus-circle"></i> Novo Chamado</h2>
                    <form id="ticketForm">
                        <div class="form-group">
                            <label for="title">Título</label>
                            <input type="text" id="title" placeholder="Digite o título do chamado" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <textarea id="description" rows="4" placeholder="Descreva o problema" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="solicitante">Solicitante</label>
                            <input type="text" id="solicitante" placeholder="Nome de quem está abrindo o chamado" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Categoria</label>
                            <select id="category" required>
                                <option value="Hardware">Hardware</option>
                                <option value="Software">Software</option>
                                <option value="Rede">Rede</option>
                                <option value="Acesso">Acesso</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Criar Chamado
                        </button>
                    </form>
                </div>
            </section>

            <!-- Filtros e Listagem -->
            <section class="list-section">
                <div class="card">
                    <div class="list-header">
                        <h2><i class="fas fa-list"></i> Chamados</h2>
                        <div class="filter-controls">
                            <select id="statusFilter">
                                <option value="all">Todos</option>
                                <option value="Pendente">Pendente</option>
                                <option value="Em Andamento">Em Andamento</option>
                                <option value="Resolvido">Resolvido</option>
                            </select>
                            <button id="refreshBtn" class="btn btn-secondary">
                                <i class="fas fa-sync"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Loading -->
                    <div id="loadingIndicator" class="loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Carregando chamados...</span>
                    </div>
                    
                    <!-- Lista de Chamados -->
                    <div id="ticketList" class="ticket-list">
                        <!-- Renderizado dinamicamente -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
